name: Publish Docker image

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and publish
        required: true
        type: string
      source_ref:
        description: Source revision to build; defaults to the release tag
        required: false
        default: ""
        type: string
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - .github/workflows/publish-docker.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - .github/workflows/publish-docker.yml

env:
  IMAGE_NAME: ghcr.io/mroxso/fpveditor

jobs:
  build:
    name: Build and verify image
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_call'
        with:
          ref: ${{ inputs.source_ref || inputs.tag }}
      - uses: actions/checkout@v4
        if: github.event_name != 'workflow_call'
      - uses: docker/setup-buildx-action@v3
      - name: Build image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: fpveditor-cli:ci
      - name: Verify container runs fpv --help
        run: docker run --rm fpveditor-cli:ci --help

  publish:
    name: Publish image to GHCR
    if: github.event_name == 'workflow_call'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || inputs.tag }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image version
        id: version
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ inputs.tag }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
