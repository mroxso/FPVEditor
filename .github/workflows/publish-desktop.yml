name: Publish desktop release

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and publish
        required: true
        type: string
      source_ref:
        description: Source revision to build; defaults to the release tag
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string
      source_ref:
        description: Source revision to build; defaults to the release tag
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            os: macos-14
            target: aarch64-apple-darwin
            bundle: dmg
          - name: macOS x64
            os: macos-13
            target: x86_64-apple-darwin
            bundle: dmg
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: msi
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install FFmpeg build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential nasm
      - name: Install FFmpeg build dependencies (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-gcc
            make
            nasm
            curl
            tar
      - name: Build bundled FFmpeg tools (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ./scripts/build-ffmpeg.sh
      - name: Build bundled FFmpeg tools
        if: runner.os != 'Windows'
        run: ./scripts/build-ffmpeg.sh
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
        working-directory: frontend
      - name: Build desktop bundle
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: crates/fpv-app
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
      - name: Verify frontend assets were built
        shell: bash
        run: |
          test -s frontend/dist/index.html
          test "$(find frontend/dist/assets -type f | wc -l)" -gt 0
      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            target/**/bundle/*/*.AppImage
            target/**/bundle/*/*.deb
            target/**/bundle/*/*.dmg
            target/**/bundle/*/*.msi
            crates/fpv-app/target/**/bundle/*/*.AppImage
            crates/fpv-app/target/**/bundle/*/*.deb
            crates/fpv-app/target/**/bundle/*/*.dmg
            crates/fpv-app/target/**/bundle/*/*.msi
          if-no-files-found: error

  ffmpeg-source:
    name: Publish FFmpeg corresponding source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || inputs.tag }}
      - name: Download pinned FFmpeg source
        run: |
          mkdir -p release-assets
          curl --fail --location --retry 3 --output release-assets/ffmpeg-7.1.1.tar.xz https://ffmpeg.org/releases/ffmpeg-7.1.1.tar.xz
          echo "733984395e0dbbe5c046abda2dc49a5544e7e0e1e2366bba849222ae9e3a03b1  release-assets/ffmpeg-7.1.1.tar.xz" | sha256sum --check
          cp docs/legal/ffmpeg.md release-assets/FFMPEG-NOTICE.md
          cp scripts/build-ffmpeg.sh release-assets/build-ffmpeg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-source
          path: release-assets/

  release:
    needs: [build, ffmpeg-source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          generate_release_notes: true
          files: release-assets/**
