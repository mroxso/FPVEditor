name: Publish release

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and publish
        required: true
        type: string
      source_ref:
        description: Source revision to build; defaults to the release tag
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string
      source_ref:
        description: Source revision to build; defaults to the release tag
        required: false
        default: ""
        type: string

permissions:
  contents: write
  packages: write

jobs:
  desktop:
    uses: ./.github/workflows/publish-desktop.yml
    with:
      tag: ${{ inputs.tag }}
      source_ref: ${{ inputs.source_ref }}

  cli:
    uses: ./.github/workflows/publish-cli.yml
    with:
      tag: ${{ inputs.tag }}
      source_ref: ${{ inputs.source_ref }}

  docker:
    uses: ./.github/workflows/publish-docker.yml
    with:
      tag: ${{ inputs.tag }}
      source_ref: ${{ inputs.source_ref }}

  release:
    needs: [desktop, cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate CLI checksums
        shell: bash
        run: |
          cd release-assets
          find . -maxdepth 1 -type f -name 'fpv-cli-*' -printf '%f\0' | sort -z | xargs -0 sha256sum > fpv-cli-checksums.txt
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          generate_release_notes: true
          files: release-assets/**
