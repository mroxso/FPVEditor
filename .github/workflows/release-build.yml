name: Build and publish release

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and publish
        required: true
        type: string
      source_ref:
        description: Source revision to build; defaults to the release tag
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string
      source_ref:
        description: Source revision to build; defaults to the release tag
        required: false
        default: ""
        type: string

env:
  IMAGE_NAME: ghcr.io/mroxso/fpveditor

permissions:
  contents: write
  packages: write

jobs:
  desktop:
    name: Build desktop ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            os: macos-26
            target: aarch64-apple-darwin
            bundle: dmg
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: msi
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: appimage,deb
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
        working-directory: frontend
      - name: Build desktop bundle
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: crates/fpv-app
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
      - name: Verify frontend assets were built
        shell: bash
        run: |
          test -s frontend/dist/index.html
          test "$(find frontend/dist/assets -type f | wc -l)" -gt 0
      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            target/**/bundle/*/*.AppImage
            target/**/bundle/*/*.deb
            target/**/bundle/*/*.dmg
            target/**/bundle/*/*.msi
            crates/fpv-app/target/**/bundle/*/*.AppImage
            crates/fpv-app/target/**/bundle/*/*.deb
            crates/fpv-app/target/**/bundle/*/*.dmg
            crates/fpv-app/target/**/bundle/*/*.msi
          if-no-files-found: error

  cli:
    name: Build CLI ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Intel builds are intentionally not published at this time.
          - name: macOS ARM64
            os: macos-26
            asset: macos-arm64
            archive: tar.gz
          - name: Windows x64
            os: windows-latest
            asset: windows-x64
            archive: zip
          - name: Linux x64
            os: ubuntu-22.04
            asset: linux-x64
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build CLI
        run: cargo build --release -p fpv-cli
      - name: Verify CLI
        shell: bash
        run: cargo run --release -p fpv-cli -- --help
      - name: Package CLI (macOS and Linux)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir dist
          tar -C target/release -czf "dist/fpv-cli-${{ matrix.asset }}.tar.gz" fpv
      - name: Package CLI (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Compress-Archive -Path target/release/fpv.exe -DestinationPath "dist/fpv-cli-${{ matrix.asset }}.zip"
      - name: Upload CLI release asset
        uses: actions/upload-artifact@v4
        with:
          name: fpv-cli-${{ matrix.asset }}
          path: dist/fpv-cli-${{ matrix.asset }}.${{ matrix.archive }}
          if-no-files-found: error

  docker:
    name: Build and publish Docker image (linux/amd64)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || inputs.tag }}
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image version
        id: version
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ inputs.tag }}
      - name: Build and push
        uses: docker/build-push-action@v6
        env:
          # The build record is an internal debugging artifact, not a release
          # asset; uploading it only adds noise to the run's artifact list.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest

  release:
    name: Attach release assets
    needs: [desktop, cli]
    runs-on: ubuntu-latest
    steps:
      # Download only the artifacts this job publishes. Downloading everything
      # also pulls in unrelated artifacts such as the `.dockerbuild` build
      # record from docker/build-push-action, which fails the job and would be
      # attached to the release.
      - name: Download desktop bundles
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Download CLI archives
        uses: actions/download-artifact@v4
        with:
          pattern: fpv-cli-*
          path: release-assets
          merge-multiple: true
      - name: Generate CLI checksums
        shell: bash
        run: |
          cd release-assets
          find . -maxdepth 1 -type f -name 'fpv-cli-*' -printf '%f\0' | sort -z | xargs -0 sha256sum > fpv-cli-checksums.txt
      - name: Attach assets to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          generate_release_notes: true
          files: release-assets/**
